name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir _site
          cp RTZWeb/index.html RTZWeb/styles.css RTZWeb/brand.css RTZWeb/TRZ-Logo-HD-small.png RTZWeb/font-preview.html _site/
          cp -R RTZWeb/CentralNavigation RTZWeb/ComingSoon RTZWeb/SatyakamsVGal _site/
          mkdir -p _site/ShrikantsSongs/Vinyl
          cp RTZWeb/ShrikantsSongs/index.html RTZWeb/ShrikantsSongs/styles.css RTZWeb/ShrikantsSongs/script.js RTZWeb/ShrikantsSongs/T-GoldGramophone.gif _site/ShrikantsSongs/
          cp -R RTZWeb/ShrikantsSongs/Vinyl/FirstAndGifs _site/ShrikantsSongs/Vinyl/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
