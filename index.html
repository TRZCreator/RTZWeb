<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <meta name="description" content="Coming soon landing page with a dark starfield and luxurious gold aesthetic." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="page-shell">
      <header class="topbar" aria-label="site header">
        <div class="brand-round" aria-label="brand logo">
          <img src="TRZ-Logo-HD-small.png" alt="butterfly crest emblem" class="butterfly-image butterfly-image--small">
        </div>
      </header>

      <main class="hero" aria-label="coming soon announcement">
        <div class="headline-wrap">
          <h1>Coming Soon</h1>
        </div>

        <div class="crest-wrap" aria-label="gold butterfly emblem">
          <div class="crest-image-wrap">
            <img src="TRZ-Logo-HD.png" alt="butterfly crest emblem" class="butterfly-image butterfly-image--large">
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
