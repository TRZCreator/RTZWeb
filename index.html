<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <meta name="description" content="Coming soon landing page with a dark starfield and luxurious gold aesthetic." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="page-shell">
      <header class="topbar" aria-label="site header">
        <div class="brand-round" aria-label="brand logo">
          <svg viewBox="0 0 120 120" class="brand-svg" role="img" aria-label="gold butterfly logo">
            <circle cx="60" cy="60" r="56" class="ring-outer" />
            <circle cx="60" cy="60" r="46" class="ring-inner" />
            <path class="butterfly wing wing-left" d="M60 26C41 32 24 47 20 60C25 71 42 84 60 90C52 74 50 64 60 57C70 64 68 74 60 90C78 84 95 71 100 60C96 47 79 32 60 26Z"/>
            <path class="butterfly wing wing-right" d="M60 26C79 32 96 47 100 60C95 71 78 84 60 90C68 74 70 64 60 57C50 64 52 74 60 90C42 84 25 71 20 60C24 47 41 32 60 26Z"/>
            <path class="body" d="M60 31V89"/>
            <path class="body" d="M60 52C49 57 46 68 60 78C74 68 71 57 60 52Z"/>
          </svg>
        </div>
      </header>

      <main class="hero" aria-label="coming soon announcement">
        <div class="headline-wrap">
          <h1>Coming Soon</h1>
        </div>

        <div class="crest-wrap" aria-label="gold butterfly emblem">
          <div class="crest-circle">
            <svg viewBox="0 0 220 220" class="crest-svg" role="img" aria-label="butterfly crest emblem">
              <circle cx="110" cy="110" r="98" class="crest-ring-outer" />
              <circle cx="110" cy="110" r="82" class="crest-ring-inner" />
              <path class="crest-wing left" d="M110 38C74 48 44 70 37 110C48 130 70 155 110 175C98 144 96 124 110 106C124 124 122 144 110 175C150 155 172 130 183 110C176 70 146 48 110 38Z"/>
              <path class="crest-wing right" d="M110 38C146 48 176 70 183 110C172 130 150 155 110 175C122 144 124 124 110 106C96 124 94 144 110 175C70 155 48 130 37 110C44 70 74 48 110 38Z"/>
              <path class="crest-body" d="M110 44V169"/>
              <path class="crest-body" d="M110 95C95 102 90 118 110 138C130 118 125 102 110 95Z"/>
            </svg>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
