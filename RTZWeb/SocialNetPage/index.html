<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coming soon to The Recreation Zone social channels."
    />
    <title>Coming Soon | The Recreation Zone</title>
    <link rel="icon" type="image/png" href="../TRZ-Logo-HD-small.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar" aria-label="The Recreation Zone brand header">
        <div class="brand-badge" aria-label="The Recreation Zone home">
          <img class="brand-badge__icon" src="../TRZ-Logo-HD-small.png" alt="" />
        </div>
      </header>

      <main class="hero" aria-label="Coming soon announcement">
        <div class="headline-wrap">
          <h1>Coming Soon</h1>
        </div>

        <div class="social-list" aria-label="The Recreation Zone social profiles">
          <a class="social-row" href="https://www.instagram.com/trzoninsta/" target="_blank" rel="noreferrer">
            <span class="social-row__icon social-row__icon--instagram" aria-label="Instagram">
              <img src="../ThirdPartyLogos/Instagram_Glyph_Gradient.svg" alt="Instagram" />
            </span>
            <span class="social-row__label">TRZonInsta</span>
          </a>

          <a class="social-row" href="https://www.facebook.com/profile.php?id=61595407977916" target="_blank" rel="noreferrer">
            <span class="social-row__icon social-row__icon--facebook" aria-label="Facebook">
              <img src="../ThirdPartyLogos/Facebook_Logo_Primary.svg" alt="Facebook" />
            </span>
            <span class="social-row__label">TRZonFB</span>
          </a>

          <a class="social-row" href="https://whatsapp.com/channel/0029Vb8su8GEwEjnSXkTJ829" target="_blank" rel="noreferrer">
            <span class="social-row__icon social-row__icon--whatsapp" aria-label="WhatsApp">
              <img src="../ThirdPartyLogos/Digital_Glyph_Green_RGB_2026.svg" alt="WhatsApp" />
            </span>
            <span class="social-row__label">TRZonWhatsApp</span>
          </a>
        </div>

        <aside class="crest-panel" aria-label="The Recreation Zone emblem">
          <div class="crest-image-wrap">
            <div class="crest-ring crest-ring--outer" aria-hidden="true"></div>
            <div class="crest-ring crest-ring--inner" aria-hidden="true"></div>
            <img src="../ComingSoon/TRZ-Logo-HD.png" alt="The Recreation Zone butterfly emblem" class="butterfly-image" />
          </div>
          <div class="brand-name">The Recreation Zone</div>
        </aside>
      </main>
    </div>
  </body>
</html>
