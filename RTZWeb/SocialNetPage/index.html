<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Recreation Zone social links and community launch page."
    />
    <title>The Recreation Zone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="The Recreation Zone header">
      <div class="site-header__brand">
        <div class="site-header__logo" aria-hidden="true">
          <img
            class="site-header__butterfly"
            src="https://horizons-cdn.hostinger.com/4fe1efa3-014e-4cb6-99ff-e0d93eac1938/af69ce4f7db29f0620d05662f2ab3b5e.png"
            alt=""
          />
        </div>
        <div class="site-header__rule" aria-hidden="true"></div>
        <h1 class="site-header__title">The Recreation Zone</h1>
      </div>
    </header>

    <main class="launch-page">
      <section class="launch-hero" aria-label="The Recreation Zone social launch page">
        <div class="launch-hero__stars" aria-hidden="true"></div>
        <div class="launch-hero__stars launch-hero__stars--far" aria-hidden="true"></div>
        <div class="launch-hero__stars launch-hero__stars--dense" aria-hidden="true"></div>

        <div class="launch-hero__body">
          <ul class="social-list" aria-label="The Recreation Zone social platforms">
            <li>
              <a
                class="social-row"
                href="https://www.instagram.com/trzoninsta/"
                target="_blank"
                rel="noreferrer"
              >
                <span class="social-row__icon social-row__icon--instagram" aria-hidden="true">◎</span>
                <span class="gold-type social-row__label">TRZonInsta</span>
              </a>
            </li>
            <li>
              <a
                class="social-row"
                href="https://www.facebook.com/profile.php?id=61595407977916"
                target="_blank"
                rel="noreferrer"
              >
                <span class="social-row__icon social-row__icon--facebook" aria-hidden="true">f</span>
                <span class="gold-type social-row__label">TRZonFB</span>
              </a>
            </li>
            <li>
              <a
                class="social-row"
                href="https://whatsapp.com/channel/0029Vb8su8GEwEjnSXkTJ829"
                target="_blank"
                rel="noreferrer"
              >
                <span class="social-row__icon social-row__icon--whatsapp" aria-hidden="true">✓</span>
                <span class="gold-type social-row__label">TRZonWhatsApp</span>
              </a>
            </li>
          </ul>

          <div class="brand-lockup" aria-label="The Recreation Zone brand mark">
            <img
              class="brand-lockup__mark"
              src="https://horizons-cdn.hostinger.com/4fe1efa3-014e-4cb6-99ff-e0d93eac1938/af69ce4f7db29f0620d05662f2ab3b5e.png"
              alt="The Recreation Zone logo"
              width="480"
              height="480"
              decoding="async"
            />
            <p class="gold-type brand-lockup__name">The Recreation Zone</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
