<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore Shrikant's vinyl artwork and animated covers."
    />
    <title>Shrikant's Songs | The Recreation Zone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../brand.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <main class="music-page">
      <a class="site-brand" href="../CentralNavigation/index.html" aria-label="The Recreation Zone home">
        <img class="site-brand-icon" src="../TRZ-Logo-HD-small.png" alt="" />
        <span class="site-brand-label">The Recreation Zone</span>
      </a>

      <header class="page-heading">
        <h1>Shrikant's Songs</h1>
        <p class="eyebrow">A little music, a little magic</p>
      </header>

      <section class="music-stage" aria-label="Vinyl collection">
        <div class="vinyl-grid" aria-label="Vinyl cover artwork">
          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for Asha Ki Bhasha"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Vinyl%20-%20Asha%20Ki%20Bhasha.png"
              data-animation="Vinyl/FirstAndGifs/Vinyl%20-%20Asha%20Ki%20Bhasha.gif"
              data-track="Vinyl/FirstAndGifs/Asha%20Ki%20Bhashaa.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Vinyl%20-%20Asha%20Ki%20Bhasha.png" alt="" />
            </button>
            <figcaption>Asha Ki Bhasha</figcaption>
          </figure>

          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for Jab De Do Sab"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Vinyl%20-%20Jab%20De%20Do%20Sab.png"
              data-animation="Vinyl/FirstAndGifs/Vinyl%20-%20Jab%20De%20Do%20Sab.gif"
              data-track="Vinyl/FirstAndGifs/Jab%20De%20Do%20Sab%20320.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Vinyl%20-%20Jab%20De%20Do%20Sab.png" alt="" />
            </button>
            <figcaption>Jab De Do Sab</figcaption>
          </figure>

          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for Laksh Ka Paksh"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Vinyl%20-%20Laksh%20Ka%20Paksh.png"
              data-animation="Vinyl/FirstAndGifs/Vinyl%20-%20Laksh%20Ka%20Paksh.gif"
              data-track="Vinyl/FirstAndGifs/Laksh%20Ka%20Paksh.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Vinyl%20-%20Laksh%20Ka%20Paksh.png" alt="" />
            </button>
            <figcaption>Laksh Ka Paksh</figcaption>
          </figure>

          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for No Syntax Stone Axe"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Vinyl%20-%20No%20Syntax%20Stone%20Axe.png"
              data-animation="Vinyl/FirstAndGifs/Vinyl%20-%20No%20Syntax%20Stone%20Axe.gif"
              data-track="Vinyl/FirstAndGifs/No%20Syntax%20Stone%20Axe.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Vinyl%20-%20No%20Syntax%20Stone%20Axe.png" alt="" />
            </button>
            <figcaption>No Syntax Stone Axe</figcaption>
          </figure>

          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for Papa Dikhte Nahi"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Vinyl%20-%20Papa%20Dikhte%20Nahi.png"
              data-animation="Vinyl/FirstAndGifs/Vinyl%20-%20Papa%20Dikhte%20Nahi.gif"
              data-track="Vinyl/FirstAndGifs/Papa%20Dikhte%20Nahi.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Vinyl%20-%20Papa%20Dikhte%20Nahi.png" alt="" />
            </button>
            <figcaption>Papa Dikhte Nahi</figcaption>
          </figure>

          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for Woh Kuchh Nahi Karti"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Vinyl%20-%20Woh%20Kuchh%20Nahi%20Karti.png"
              data-animation="Vinyl/FirstAndGifs/Vinyl%20-%20Woh%20Kuchh%20Nahi%20Karti.gif"
              data-track="Vinyl/FirstAndGifs/Woh%20Kuchh%20Nahi%20Karti.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Vinyl%20-%20Woh%20Kuchh%20Nahi%20Karti.png" alt="" />
            </button>
            <figcaption>Woh Kuchh Nahi Karti</figcaption>
          </figure>

          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for Woh To Maa Hai"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Vinyl-Woh%20To%20Maa%20Hai.png"
              data-animation="Vinyl/FirstAndGifs/Vinyl%20-%20Woh%20To%20Maa%20Hai.gif"
              data-track="Vinyl/FirstAndGifs/Woh%20To%20Maa%20Hai.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Vinyl-Woh%20To%20Maa%20Hai.png" alt="" />
            </button>
            <figcaption>Woh To Maa Hai</figcaption>
          </figure>

          <figure class="vinyl-item">
            <button
              class="vinyl-artwork"
              type="button"
              aria-label="Show animated artwork for Sthitaprajna"
              aria-pressed="false"
              data-still="Vinyl/FirstAndGifs/Sthitaprajna.png"
              data-animation="Vinyl/FirstAndGifs/Sthitaprajna.gif"
              data-track="Vinyl/FirstAndGifs/Sthitaprajna.mp3"
            >
              <img src="Vinyl/FirstAndGifs/Sthitaprajna.png" alt="" />
            </button>
            <figcaption>Sthitaprajna</figcaption>
          </figure>
        </div>

        <aside class="turntable-art" aria-label="Record player">
          <a class="record-stack-link" href="../ComingSoon/index.html" aria-label="Explore more in Coming Soon">
            <img
              class="record-stack-image"
              src="Vinyl/FirstAndGifs/Record%20Stack.png"
              alt="A stack of vinyl records"
            />
          </a>
          <img
            class="gramophone-image"
            src="T-GoldGramophone.gif"
            alt="An antique golden gramophone"
          />
          <p class="selection-hint" aria-live="polite">Turn up a favorite. Stay awhile.</p>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
